<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pong Apocalypse – Full Screen Slide</title>
<style>
body{
  margin:0;
  background:#000;
  color:#0f0;
  font-family:monospace;
  text-align:center;
  touch-action:none;
}
canvas{
  background:#000;
  border:2px solid #0f0;
  display:block;
  margin:auto;
}
#menu{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:14px;
}
button,select{
  padding:14px;
  font-size:18px;
  background:#000;
  color:#0f0;
  border:2px solid #0f0;
}
#ui{
  display:flex;
  justify-content:space-around;
  font-size:16px;
  margin-top:6px;
}
#countdown{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:120px;
  background:rgba(0,0,0,0.7);
  color:#0f0;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="menu">
<h1>PONG APOCALYPSE</h1>
<select id="difficulty">
<option value="easy">Easy</option>
<option value="normal" selected>Normal</option>
<option value="hard">Hard</option>
<option value="impossible">IMPOSSIBLE</option>
</select>
<button onclick="start()">START</button>
</div>

<div id="countdown" style="display:none">3</div>

<div id="ui">
<div id="score">Score: 0</div>
<div id="lives">Lives: 3</div>
<div id="high">High: 0</div>
</div>

<canvas id="c" width="720" height="720"></canvas>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const highEl=document.getElementById("high");
const menu=document.getElementById("menu");
const cdEl=document.getElementById("countdown");

let p1,p2,ball;
let score=0,lives=3,aiMiss=0,running=false;
let high=+localStorage.getItem("pongHigh")||0;
let frozen=true;
let lastTouchY=null;

const MAX_SPEED=9;
const BASE_SPEED=5;

function start(){
 score=0;lives=3;aiMiss=0;
 menu.style.display="none";
 p1={x:20,y:280,w:16,h:160};
 p2={x:c.width-36,y:280,w:16,h:160};
 spawnBall();
 running=true;
 requestAnimationFrame(loop);
}

function startCountdown(){
 frozen=true;
 let count=3;
 cdEl.textContent=count;
 cdEl.style.display="flex";
 const i=setInterval(()=>{
   count--;
   if(count===0){
     cdEl.style.display="none";
     frozen=false;
     clearInterval(i);
   }else cdEl.textContent=count;
 },1000);
}

function spawnBall(){
 const a=(Math.random()*Math.PI/4)-(Math.PI/8);
 const d=Math.random()>0.5?1:-1;
 ball={
  x:c.width/2,
  y:c.height/2,
  r:8,
  vx:Math.cos(a)*BASE_SPEED*d,
  vy:Math.sin(a)*BASE_SPEED
 };
 startCountdown();
}

// FULL SCREEN SLIDE CONTROL
document.addEventListener("touchstart",e=>{
 lastTouchY=e.touches[0].clientY;
});
document.addEventListener("touchmove",e=>{
 if(lastTouchY===null)return;
 const y=e.touches[0].clientY;
 const dy=y-lastTouchY;
 p1.y+=dy;
 lastTouchY=y;
});
document.addEventListener("touchend",()=>lastTouchY=null);

function update(){
 if(!running||frozen)return;

 p1.y=Math.max(0,Math.min(c.height-p1.h,p1.y));

 const diff=document.getElementById("difficulty").value;
 const follow=diff==="impossible"?0.12:diff==="hard"?0.09:diff==="easy"?0.05:0.07;
 p2.y+=(ball.y-(p2.y+p2.h/2))*follow;
 p2.y=Math.max(0,Math.min(c.height-p2.h,p2.y));

 ball.x+=ball.vx;
 ball.y+=ball.vy;

 if(ball.y-ball.r<=0||ball.y+ball.r>=c.height)ball.vy*=-1;

 function bounce(p){
  const rel=(p.y+p.h/2)-ball.y;
  const norm=rel/(p.h/2);
  const ang=norm*(Math.PI/3);
  const sp=Math.min(MAX_SPEED,Math.hypot(ball.vx,ball.vy)+0.3);
  const dir=p===p1?1:-1;
  ball.vx=Math.cos(ang)*sp*dir;
  ball.vy=-Math.sin(ang)*sp;
 }

 if(ball.x-ball.r<=p1.x+p1.w&&ball.y>=p1.y&&ball.y<=p1.y+p1.h){
  ball.x=p1.x+p1.w+ball.r;
  bounce(p1);
  score++;
 }
 if(ball.x+ball.r>=p2.x&&ball.y>=p2.y&&ball.y<=p2.y+p2.h){
  ball.x=p2.x-ball.r;
  bounce(p2);
 }

 if(ball.x+ball.r<0){
  lives--;
  spawnBall();
  if(lives<=0)end();
 }
 if(ball.x-ball.r>c.width){
  aiMiss++;
  spawnBall();
  if(aiMiss>=3)end();
 }

 scoreEl.textContent="Score: "+score;
 livesEl.textContent="Lives: "+lives;
 highEl.textContent="High: "+high;
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="#0f0";
 ctx.fillRect(p1.x,p1.y,p1.w,p1.h);
 ctx.fillRect(p2.x,p2.y,p2.w,p2.h);
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fill();
}

function end(){
 running=false;
 if(score>high){
  high=score;
  localStorage.setItem("pongHigh",high);
 }
 menu.style.display="flex";
}

function loop(){
 update();
 draw();
 if(running)requestAnimationFrame(loop);
}
</script>
</body>
</html>
